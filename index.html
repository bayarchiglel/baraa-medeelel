<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chiglel LLC — Product Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf0f3;          /* workshop gray */
  --surface:#ffffff;
  --ink:#14202e;         /* steel navy */
  --muted:#5c6b7a;
  --faint:#94a1ae;
  --line:#d5dbe2;
  --line-soft:#e8ecf0;
  --brand:#1660c9;       /* Chiglel blue */
  --brand-deep:#0e3b7e;
  --brand-soft:#e8f0fc;
  --ok:#1e7a46;
  --ok-soft:#e6f3ec;
  --warn:#b35a00;
  --warn-soft:#fbf0e3;
  --kr:#6242b8;  --kr-soft:#efe9fb;
  --tr:#b32430;  --tr-soft:#fbe9ea;
  --ru:#8a6d00;  --ru-soft:#f8f2da;
  --mono:'IBM Plex Mono',Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --disp:'Archivo',var(--sans);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:var(--sans)}

/* ───────── HEADER ───────── */
header{
  background:var(--ink);color:#fff;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff}
.brand-mark{
  width:30px;height:30px;background:var(--brand);border-radius:6px;
  display:grid;place-items:center;
  font:800 16px var(--disp);color:#fff;
}
.brand-name{font:700 15px var(--disp);letter-spacing:.04em}
.brand-name small{display:block;font:400 10px var(--mono);color:#8fa3b8;letter-spacing:.14em;margin-top:1px}
.h-right{display:flex;gap:10px;align-items:center}
.h-link{color:#8fa3b8;font:12px var(--mono);text-decoration:none;padding:6px 4px}
.h-link:hover{color:#fff}
.h-admin{
  background:var(--brand);color:#fff;text-decoration:none;
  font:600 12px var(--sans);padding:8px 15px;border-radius:6px;
}
.h-admin:hover{background:#1252ad}

/* ───────── TOOLBAR ───────── */
.toolbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 28px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  position:sticky;top:58px;z-index:40;
}
.tb-group{display:flex;align-items:center;gap:7px}
.tb-label{font:600 10px var(--mono);color:var(--faint);letter-spacing:.12em;text-transform:uppercase}

.search-wrap{position:relative;width:270px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search{
  width:100%;padding:8px 12px 8px 33px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);font:13px var(--sans);color:var(--ink);outline:none;transition:.15s;
}
.search:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(22,96,201,.1)}

/* segmented control */
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px;gap:1px}
.seg button{
  border:0;background:transparent;padding:6px 11px;border-radius:5px;
  font:500 12px var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.13s;
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,32,46,.14)}
.seg button.on[data-v="Монгол"]{color:var(--ok)}
.seg button.on[data-v="Хятад"]{color:var(--warn)}
.seg button.on[data-v="Солонгос"]{color:var(--kr)}
.seg button.on[data-v="Турк"]{color:var(--tr)}
.seg button.on[data-v="Орос"]{color:var(--ru)}

.pdf-toggle{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--bg);border-radius:7px;
  padding:7px 13px;font:500 12px var(--sans);color:var(--muted);cursor:pointer;transition:.13s;
}
.pdf-toggle.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.export{
  display:flex;align-items:center;gap:6px;margin-left:auto;
  border:1px solid var(--ok);background:var(--ok-soft);border-radius:7px;
  padding:7px 14px;font:600 12px var(--sans);color:var(--ok);cursor:pointer;transition:.13s;
}
.export:hover{background:var(--ok);color:#fff}

.stats{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.stats b{color:var(--ink)}

/* ───────── LAYOUT ───────── */
.layout{display:flex;align-items:flex-start}

.sidebar{
  width:236px;min-width:236px;background:var(--surface);
  border-right:1px solid var(--line);
  position:sticky;top:117px;height:calc(100vh - 117px);overflow-y:auto;
  padding:16px 0 24px;
}
.side-label{font:600 10px var(--mono);color:var(--faint);letter-spacing:.14em;text-transform:uppercase;padding:6px 20px 8px}
.cat{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  width:100%;border:0;background:transparent;text-align:left;
  padding:8px 20px;font:13px var(--sans);color:var(--muted);cursor:pointer;
  border-left:3px solid transparent;transition:.12s;line-height:1.35;
}
.cat:hover{background:var(--bg);color:var(--ink)}
.cat.on{background:var(--brand-soft);color:var(--brand-deep);border-left-color:var(--brand);font-weight:600}
.cat .n{font:500 11px var(--mono);color:var(--faint);flex-shrink:0}
.cat.on .n{color:var(--brand)}

main{flex:1;padding:22px 26px;min-width:0}

/* ───────── PRODUCT GRID ───────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}

.card{
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:15px 16px 13px;transition:.16s;position:relative;
}
.card:hover{border-color:var(--brand);box-shadow:0 6px 20px rgba(14,59,126,.12);transform:translateY(-2px)}

/* nameplate code chip — the signature */
.plate-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.plate{
  font:600 13px var(--mono);color:var(--ink);letter-spacing:.05em;
  background:linear-gradient(180deg,#f7f9fa,#eceff2);
  border:1px solid var(--line);border-radius:5px;
  padding:3px 9px;
  box-shadow:inset 0 1px 0 #fff, 0 1px 1px rgba(20,32,46,.06);
}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font:600 9.5px var(--mono);padding:3px 7px;border-radius:4px;letter-spacing:.05em;white-space:nowrap}
.t-mn{background:var(--ok-soft);color:var(--ok)}
.t-cn{background:var(--warn-soft);color:var(--warn)}
.t-kr{background:var(--kr-soft);color:var(--kr)}
.t-tr{background:var(--tr-soft);color:var(--tr)}
.t-ru{background:var(--ru-soft);color:var(--ru)}
.t-abc{background:#eef1f4;color:var(--muted)}

.cname{
  font:600 13.5px/1.42 var(--sans);color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:38px;margin-bottom:10px;
}

/* spec rows with dotted leaders — like the printed manual */
.specs{flex:1;display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.srow{display:flex;align-items:baseline;gap:6px;font-size:11.5px;min-width:0}
.srow .k{color:var(--faint);flex-shrink:0}
.srow .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-3px);min-width:12px}
.srow .v{font:500 11.5px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}

.cfoot{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-top:1px solid var(--line-soft);padding-top:10px;
}
.price{font:600 15px var(--mono);color:var(--ink)}
.price em{font:400 10px var(--mono);color:var(--faint);font-style:normal;margin-left:2px}
.noprice{font:500 11px var(--mono);color:var(--faint)}
.manual-chip{
  display:flex;align-items:center;gap:4px;
  font:600 10px var(--mono);color:var(--brand);
  background:var(--brand-soft);border:1px solid #c7dcf7;border-radius:5px;
  padding:4px 8px;white-space:nowrap;
}

/* ───────── EMPTY / LOADING ───────── */
.state{grid-column:1/-1;text-align:center;padding:70px 24px;color:var(--muted)}
.state .big{font-size:38px;margin-bottom:10px;opacity:.5}
.state h3{margin:0 0 6px;font:600 16px var(--sans);color:var(--ink)}
.state p{margin:0;font-size:13px;line-height:1.6}
.state a{color:var(--brand)}

/* ───────── PAGINATION ───────── */
.pages{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;padding:26px 0 10px}
.pg{
  min-width:33px;height:33px;border:1px solid var(--line);background:var(--surface);
  border-radius:7px;color:var(--muted);cursor:pointer;font:500 12px var(--mono);
  display:inline-flex;align-items:center;justify-content:center;padding:0 9px;transition:.12s;
}
.pg:hover:not(:disabled):not(.on){border-color:var(--brand);color:var(--brand)}
.pg.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pg:disabled{opacity:.35;cursor:default}
.pg-dots{color:var(--faint);padding:0 3px;font:12px var(--mono)}

@media(max-width:860px){
  header{padding:0 16px}
  .toolbar{padding:10px 16px;top:58px}
  .sidebar{display:none}
  main{padding:14px}
  .search-wrap{width:100%}
  .export{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <span class="brand-mark">Ч</span>
    <span class="brand-name">CHIGLEL LLC<small>PRODUCT CATALOG</small></span>
  </a>
  <div class="h-right">
    <a class="h-link" href="https://www.chiglel.mn" target="_blank" rel="noopener">chiglel.mn ↗</a>
    <a class="h-admin" href="admin/index.html">Admin panel</a>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="q" class="search" placeholder="Search name, code, model, brand…">
  </div>

  <div class="tb-group">
    <span class="tb-label">Origin</span>
    <div class="seg" id="originSeg">
      <button class="on" data-v="">All</button>
      <button data-v="Монгол">Mongolia</button>
      <button data-v="Хятад">China</button>
      <button data-v="Солонгос">Korea</button>
      <button data-v="Турк">Turkey</button>
      <button data-v="Орос">Russia</button>
    </div>
  </div>

  <div class="tb-group">
    <span class="tb-label">ABC</span>
    <div class="seg" id="abcSeg">
      <button class="on" data-v="">All</button>
      <button data-v="A">A</button>
      <button data-v="B">B</button>
      <button data-v="C">C</button>
    </div>
  </div>

  <button class="pdf-toggle" id="pdfToggle">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    With manual
  </button>

  <button class="export" id="exportBtn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Export Excel
  </button>

  <span class="stats" id="stats">Loading…</span>
</div>

<div class="layout">
  <aside class="sidebar" id="side">
    <div class="side-label">Category</div>
  </aside>
  <main>
    <div class="grid" id="list">
      <div class="state"><div class="big">⏳</div><h3>Loading products…</h3></div>
    </div>
    <div class="pages" id="pages"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
let all=[], filtered=[], page=1, cat=null, origin='', abc='', onlyManual=false;
const SIZE=48;
const $=id=>document.getElementById(id);

const ORIGIN_TAG={
  'Монгол':['MN','t-mn'],'Хятад':['CN','t-cn'],
  'Солонгос':['KR','t-kr'],'Турк':['TR','t-tr'],'Орос':['RU','t-ru'],
};

const el=(tag,cls,text)=>{
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined&&text!==null)e.textContent=String(text);
  return e;
};

async function load(){
  try{
    const r=await fetch('data/products.json');
    if(!r.ok)throw new Error('HTTP '+r.status);
    all=await r.json();
    buildSide();
    apply();
  }catch(e){
    $('list').innerHTML='';
    const s=el('div','state');
    s.append(el('div','big','⚠'),el('h3',null,'Could not load products'),el('p',null,'data/products.json — '+e.message));
    $('list').appendChild(s);
  }
}

function buildSide(){
  const map={};
  all.forEach(p=>{const k=p.category||'Other';map[k]=(map[k]||0)+1});
  const side=$('side');

  const mk=(label,value,count,active)=>{
    const b=el('button','cat'+(active?' on':''));
    b.type='button';
    const sp=el('span',null,label);
    const n=el('span','n',count);
    b.append(sp,n);
    b.onclick=()=>{
      side.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      cat=value; page=1; apply();
    };
    side.appendChild(b);
  };
  mk('All categories',null,all.length,true);
  Object.entries(map).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>mk(k,k,v,false));
}

function apply(){
  const q=$('q').value.trim().toLowerCase();
  filtered=all.filter(p=>{
    if(cat&&p.category!==cat)return false;
    if(origin&&p.origin!==origin)return false;
    if(abc&&p.abc!==abc)return false;
    if(onlyManual&&!p.manual_url)return false;
    if(q){
      const hay=[p.name,p.code,p.model,p.brand,p.subcategory,p.features].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
  const st=$('stats');
  st.innerHTML='';
  st.append(Object.assign(el('b',null,filtered.length)),document.createTextNode(' / '+all.length));
  render();
  renderPages();
}

function specRow(key,value){
  const r=el('div','srow');
  r.append(el('span','k',key),el('span','dots'),el('span','v',value));
  return r;
}

function render(){
  const root=$('list');
  root.innerHTML='';
  const slice=filtered.slice((page-1)*SIZE,page*SIZE);

  if(!slice.length){
    const s=el('div','state');
    if(onlyManual&&!all.some(p=>p.manual_url)){
      s.append(el('div','big','📄'),
        el('h3',null,'No manuals added yet'),
        el('p',null,'PDF links are added per-product from the Admin panel.'));
      const p2=el('p');
      const a=el('a',null,'Open Admin panel →');
      a.href='admin/index.html';
      p2.appendChild(a);
      s.appendChild(p2);
    }else{
      s.append(el('div','big','🔍'),
        el('h3',null,'No products found'),
        el('p',null,'Try a different search or clear the filters.'));
    }
    root.appendChild(s);
    return;
  }

  slice.forEach(p=>{
    const a=el('a','card');
    a.href='product.html?code='+encodeURIComponent(p.code);

    // nameplate row
    const pr=el('div','plate-row');
    pr.appendChild(el('span','plate','#'+p.code));
    const tags=el('div','tags');
    const ot=ORIGIN_TAG[p.origin];
    if(ot)tags.appendChild(el('span','tag '+ot[1],ot[0]));
    if(p.abc)tags.appendChild(el('span','tag t-abc',p.abc));
    pr.appendChild(tags);
    a.appendChild(pr);

    a.appendChild(el('div','cname',p.name||'—'));

    // specs (only rows with data; max 4 to keep cards even)
    const rows=[];
    if(p.brand)rows.push(['Brand',p.brand]);
    if(p.model)rows.push(['Model',p.model]);
    if(p.dims&&(p.dims.length||p.dims.width||p.dims.height)){
      const d=[p.dims.length,p.dims.width,p.dims.height].filter(Boolean).join('×');
      rows.push(['Size',d+' mm']);
    }
    if(p.power_kw)rows.push(['Power',p.power_kw+' kW']);
    if(p.voltage)rows.push(['Voltage',p.voltage+' V']);
    if(p.weight)rows.push(['Weight',p.weight+' kg']);
    if(p.features)rows.push(['Note',p.features]);

    const specs=el('div','specs');
    rows.slice(0,4).forEach(([k,v])=>specs.appendChild(specRow(k,v)));
    a.appendChild(specs);

    // footer
    const f=el('div','cfoot');
    if(p.price){
      const pe=el('span','price',Number(p.price).toLocaleString());
      pe.appendChild(el('em',null,'₮'));
      f.appendChild(pe);
    }else{
      f.appendChild(el('span','noprice','Price on request'));
    }
    if(p.manual_url){
      const m=el('span','manual-chip');
      m.append(document.createTextNode('📄 Manual'));
      f.appendChild(m);
    }
    a.appendChild(f);

    root.appendChild(a);
  });

  window.scrollTo({top:0,behavior:'smooth'});
}

function renderPages(){
  const total=Math.ceil(filtered.length/SIZE);
  const root=$('pages');
  root.innerHTML='';
  if(total<=1)return;

  const mk=(label,p,dis,on)=>{
    const b=el('button','pg'+(on?' on':''),label);
    b.type='button';b.disabled=!!dis;
    b.onclick=()=>{page=p;render();renderPages()};
    root.appendChild(b);
  };
  mk('←',page-1,page===1);
  let last=0;
  for(let i=1;i<=total;i++){
    if(i===1||i===total||Math.abs(i-page)<=2){
      if(last&&i-last>1)root.appendChild(el('span','pg-dots','…'));
      mk(i,i,false,i===page);
      last=i;
    }
  }
  mk('→',page+1,page===total);
}

// ── Excel export — same columns as the source workbook (no stock data) ──
function exportExcel(){
  const data=filtered.length?filtered:all;
  const rows=data.map(p=>({
    'Барааны код':p.code||'',
    'Барааны нэр':p.name||'',
    'Байршил':p.location||'',
    'Ангилал':p.category||'',
    'Дэд ангилал':p.subcategory||'',
    'Гарал үүсэл':p.origin||'',
    'Нэгжийн үнэ':p.price??'',
    'ABC':p.abc||'',
    'УРТ/мм/':p.dims?.length??'',
    'ӨРГӨН/мм/':p.dims?.width??'',
    'ӨНДӨР/мм/':p.dims?.height??'',
    'ЖИН/кг/':p.weight??'',
    'ОНЦЛОГ':p.features||'',
    'ХҮЧДЭЛ/волт/':p.voltage??'',
    'ХҮЧ/кВт/':p.power_kw??'',
    'БРЕНД':p.brand||'',
    'Марк':p.model||'',
    'Гарын авлага':p.manual_url?'Байгаа':'',
    'PDF линк':p.manual_url||'',
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[
    {wch:12},{wch:42},{wch:12},{wch:32},{wch:24},{wch:10},{wch:13},{wch:5},
    {wch:9},{wch:9},{wch:9},{wch:9},{wch:28},{wch:11},{wch:9},{wch:20},{wch:15},{wch:11},{wch:46},
  ];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Sheet2');
  XLSX.writeFile(wb,'Chiglel_catalog_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

// ── events ──
function segHandler(segId,setter){
  $(segId).addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b)return;
    $(segId).querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    setter(b.dataset.v);
    page=1;apply();
  });
}
segHandler('originSeg',v=>origin=v);
segHandler('abcSeg',v=>abc=v);

$('pdfToggle').onclick=()=>{
  onlyManual=!onlyManual;
  $('pdfToggle').classList.toggle('on',onlyManual);
  page=1;apply();
};
$('exportBtn').onclick=exportExcel;
$('q').addEventListener('input',()=>{page=1;apply()});

load();
</script>
</body>
</html>
