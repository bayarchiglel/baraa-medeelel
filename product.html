<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — Chiglel LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf0f3;--surface:#fff;--ink:#14202e;--muted:#5c6b7a;--faint:#94a1ae;
  --line:#d5dbe2;--line-soft:#e8ecf0;
  --brand:#1660c9;--brand-deep:#0e3b7e;--brand-soft:#e8f0fc;
  --ok:#1e7a46;--ok-soft:#e6f3ec;
  --warn:#b35a00;--warn-soft:#fbf0e3;
  --kr:#6242b8;--kr-soft:#efe9fb;
  --tr:#b32430;--tr-soft:#fbe9ea;
  --ru:#8a6d00;--ru-soft:#f8f2da;
  --mono:'IBM Plex Mono',Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --disp:'Archivo',var(--sans);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px}

header{
  background:var(--ink);color:#fff;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff}
.brand-mark{width:30px;height:30px;background:var(--brand);border-radius:6px;display:grid;place-items:center;font:800 16px var(--disp)}
.brand-name{font:700 15px var(--disp);letter-spacing:.04em}
.back{color:#8fa3b8;font:12px var(--mono);text-decoration:none;padding:8px 0}
.back:hover{color:#fff}

.wrap{max-width:1080px;margin:0 auto;padding:26px 24px 64px}

.crumb{font:11px var(--mono);color:var(--faint);display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--brand)}

.layout{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:18px}
.panel-title{
  padding:11px 20px;border-bottom:1px solid var(--line);background:#f7f9fa;
  font:600 10.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
}

/* ── nameplate hero ── */
.hero{padding:24px}
.plate-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.plate{
  font:600 15px var(--mono);color:var(--ink);letter-spacing:.05em;
  background:linear-gradient(180deg,#f7f9fa,#eceff2);
  border:1px solid var(--line);border-radius:6px;padding:5px 13px;
  box-shadow:inset 0 1px 0 #fff,0 1px 1px rgba(20,32,46,.06);
}
.tag{font:600 10px var(--mono);padding:4px 9px;border-radius:5px;letter-spacing:.05em}
.t-mn{background:var(--ok-soft);color:var(--ok)}
.t-cn{background:var(--warn-soft);color:var(--warn)}
.t-kr{background:var(--kr-soft);color:var(--kr)}
.t-tr{background:var(--tr-soft);color:var(--tr)}
.t-ru{background:var(--ru-soft);color:var(--ru)}
.t-abc{background:#eef1f4;color:var(--muted)}
.t-pdf{background:var(--brand-soft);color:var(--brand)}

h1{font:700 23px/1.32 var(--disp);margin:0 0 7px;letter-spacing:-.01em}
.cat-line{color:var(--muted);font-size:13px;margin-bottom:18px}
.cat-line b{color:var(--ink);font-weight:600}

.price-row{border-top:1px solid var(--line-soft);padding-top:16px;display:flex;align-items:baseline;gap:8px}
.price{font:600 30px var(--mono);letter-spacing:-.01em}
.unit{font:13px var(--mono);color:var(--muted)}

/* ── spec tables with dotted leaders ── */
.spec-body{padding:8px 20px 14px}
.srow{display:flex;align-items:baseline;gap:8px;padding:7px 0;font-size:13px}
.srow+.srow{border-top:1px solid var(--line-soft)}
.srow .k{color:var(--muted);flex-shrink:0}
.srow .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:20px}
.srow .v{font:500 12.5px var(--mono);color:var(--ink);text-align:right;max-width:60%;overflow-wrap:break-word}

/* ── PDF viewer ── */
.pdfbox{aspect-ratio:3/4;background:#e9ecef;max-height:560px}
.pdfbox iframe{width:100%;height:100%;border:0;display:block}
.pdf-actions{display:flex;gap:9px;padding:13px 16px;flex-wrap:wrap}
.btn{
  flex:1;display:flex;justify-content:center;align-items:center;gap:7px;
  padding:11px 14px;border-radius:7px;text-decoration:none;
  font:600 13px var(--sans);transition:.13s;min-width:140px;
}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:#1252ad}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}

.no-pdf{padding:36px 20px;text-align:center;color:var(--faint);font-size:13px}
.no-pdf .big{font-size:30px;opacity:.45;margin-bottom:8px}

/* ── contact sidebar ── */
.aside-sticky{position:sticky;top:78px}
.contact{padding:6px 18px 12px}
.c-item{display:flex;gap:12px;align-items:center;padding:10px 0}
.c-item+.c-item{border-top:1px solid var(--line-soft)}
.c-ico{width:34px;height:34px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.c-label{font:10.5px var(--mono);color:var(--faint);display:block;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1px}
.c-val{font:600 13px var(--sans);color:var(--ink)}
.c-val a{color:var(--brand);text-decoration:none}

.state{text-align:center;padding:90px 24px;color:var(--muted)}
.state .big{font-size:40px;opacity:.5;margin-bottom:12px}
.state h3{margin:0 0 8px;font:600 17px var(--sans);color:var(--ink)}
.state a{color:var(--brand)}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .aside-sticky{position:static}
  .wrap{padding:18px 14px 44px}
  header{padding:0 16px}
  h1{font-size:19px}
  .price{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <span class="brand-mark">Ч</span>
    <span class="brand-name">CHIGLEL LLC</span>
  </a>
  <a class="back" href="index.html">← Back to catalog</a>
</header>

<main class="wrap" id="root">
  <div class="state"><div class="big">⏳</div><h3>Loading…</h3></div>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined&&text!==null)e.textContent=String(text);
  return e;
};

const ORIGIN_TAG={
  'Монгол':['Mongolia','t-mn'],'Хятад':['China','t-cn'],
  'Солонгос':['Korea','t-kr'],'Турк':['Turkey','t-tr'],'Орос':['Russia','t-ru'],
};

function safeUrl(raw){
  if(!raw)return '';
  try{const u=new URL(raw);return ['http:','https:'].includes(u.protocol)?u.href:''}
  catch{return ''}
}
function driveId(raw){
  const href=safeUrl(raw);
  if(!href)return '';
  try{
    const u=new URL(href);
    if(!u.hostname.includes('drive.google.com'))return '';
    const m=u.pathname.match(/\/file\/d\/([^/]+)/);
    return m?m[1]:(u.searchParams.get('id')||'');
  }catch{return ''}
}
function manualLinks(raw){
  const href=safeUrl(raw);
  if(!href)return null;
  const id=driveId(href);
  if(id){
    const enc=encodeURIComponent(id);
    return{
      preview:'https://drive.google.com/file/d/'+enc+'/preview',
      download:'https://drive.google.com/uc?export=download&id='+enc,
      open:'https://drive.google.com/file/d/'+enc+'/view',
    };
  }
  return{preview:href,download:href,open:href};
}

function specRow(key,value){
  if(value===null||value===undefined||value==='')return null;
  const r=el('div','srow');
  r.append(el('span','k',key),el('span','dots'),el('span','v',value));
  return r;
}
function specPanel(title,rows){
  const real=rows.filter(Boolean);
  if(!real.length)return null;
  const p=el('section','panel');
  p.appendChild(el('div','panel-title',title));
  const body=el('div','spec-body');
  real.forEach(r=>body.appendChild(r));
  p.appendChild(body);
  return p;
}

function notFound(code){
  const root=$('root');
  root.innerHTML='';
  const s=el('div','state');
  s.append(el('div','big','🔍'),el('h3',null,'Product not found (#'+code+')'));
  const p=el('p');
  const a=el('a',null,'← Back to catalog');
  a.href='index.html';
  p.appendChild(a);
  s.appendChild(p);
  root.appendChild(s);
}

async function init(){
  const code=new URLSearchParams(location.search).get('code');
  if(!code){location.href='index.html';return}
  let products;
  try{
    const r=await fetch('data/products.json');
    if(!r.ok)throw new Error('HTTP '+r.status);
    products=await r.json();
  }catch(e){
    const root=$('root');
    root.innerHTML='';
    const s=el('div','state');
    s.append(el('div','big','⚠'),el('h3',null,'Could not load product data'),el('p',null,e.message));
    root.appendChild(s);
    return;
  }
  const p=products.find(x=>String(x.code)===String(code));
  if(!p)return notFound(code);
  document.title=(p.name||p.code)+' — Chiglel LLC';
  render(p);
}

function render(p){
  const root=$('root');
  root.innerHTML='';

  // breadcrumb
  const crumb=el('div','crumb');
  const home=el('a',null,'Catalog');home.href='index.html';
  crumb.append(home,document.createTextNode('/'),el('span',null,p.category||'—'));
  if(p.subcategory)crumb.append(document.createTextNode('/'),el('span',null,p.subcategory));
  root.appendChild(crumb);

  const layout=el('div','layout');
  const left=el('div');

  // ── hero with nameplate ──
  const hero=el('section','panel');
  const heroIn=el('div','hero');

  const pr=el('div','plate-row');
  pr.appendChild(el('span','plate','#'+p.code));
  const ot=ORIGIN_TAG[p.origin];
  if(ot)pr.appendChild(el('span','tag '+ot[1],ot[0]));
  if(p.abc)pr.appendChild(el('span','tag t-abc','ABC '+p.abc));
  if(p.manual_url)pr.appendChild(el('span','tag t-pdf','📄 Manual'));
  heroIn.appendChild(pr);

  heroIn.appendChild(el('h1',null,p.name||'—'));

  const cl=el('div','cat-line');
  cl.appendChild(el('b',null,p.category||'—'));
  if(p.subcategory)cl.appendChild(document.createTextNode(' / '+p.subcategory));
  heroIn.appendChild(cl);

  if(p.price){
    const prr=el('div','price-row');
    prr.append(el('span','price',Number(p.price).toLocaleString()),el('span','unit','₮ / unit'));
    heroIn.appendChild(prr);
  }
  hero.appendChild(heroIn);
  left.appendChild(hero);

  // ── general info ──
  const gen=specPanel('General information',[
    specRow('Code','#'+p.code),
    specRow('Location',p.location),
    specRow('Category',p.category),
    specRow('Subcategory',p.subcategory),
    specRow('Origin',p.origin),
    specRow('Brand',p.brand),
    specRow('Model',p.model),
    specRow('Features',p.features),
  ]);
  if(gen)left.appendChild(gen);

  // ── technical specs ──
  const dims=[];
  if(p.dims?.length)dims.push(p.dims.length);
  if(p.dims?.width)dims.push(p.dims.width);
  if(p.dims?.height)dims.push(p.dims.height);
  const tech=specPanel('Technical specifications',[
    specRow('Dimensions (L×W×H)',dims.length?dims.join(' × ')+' mm':null),
    specRow('Weight',p.weight?p.weight+' kg':null),
    specRow('Voltage',p.voltage?p.voltage+' V':null),
    specRow('Power',p.power_kw?p.power_kw+' kW':null),
  ]);
  if(tech)left.appendChild(tech);

  // ── PDF manual ──
  const links=manualLinks(p.manual_url);
  const pdf=el('section','panel');
  pdf.appendChild(el('div','panel-title','User manual'));
  if(links){
    const box=el('div','pdfbox');
    const ifr=document.createElement('iframe');
    ifr.src=links.preview;
    ifr.allowFullscreen=true;
    ifr.loading='lazy';
    box.appendChild(ifr);
    pdf.appendChild(box);

    const acts=el('div','pdf-actions');
    const dl=el('a','btn btn-primary','⬇ Download PDF');
    dl.href=links.download;dl.target='_blank';dl.rel='noopener';
    const op=el('a','btn btn-ghost','Open in Google Drive ↗');
    op.href=links.open;op.target='_blank';op.rel='noopener';
    acts.append(dl,op);
    pdf.appendChild(acts);
  }else{
    const np=el('div','no-pdf');
    np.append(el('div','big','📄'),document.createTextNode('No manual uploaded for this product yet.'));
    pdf.appendChild(np);
  }
  left.appendChild(pdf);

  // ── right sidebar ──
  const right=el('aside','aside-sticky');
  const contact=el('section','panel');
  contact.appendChild(el('div','panel-title','Contact'));
  const cbody=el('div','contact');
  [
    ['📞','Phone','+976 7611 5333',null],
    ['📱','Mobile','+976 9133 5333',null],
    ['✉️','Email','info@chiglel.mn',null],
    ['🌐','Website','chiglel.mn','https://www.chiglel.mn'],
  ].forEach(([ico,label,val,href])=>{
    const item=el('div','c-item');
    item.appendChild(el('div','c-ico',ico));
    const tx=el('div');
    tx.appendChild(el('span','c-label',label));
    const v=el('div','c-val');
    if(href){
      const a=el('a',null,val);a.href=href;a.target='_blank';a.rel='noopener';
      v.appendChild(a);
    }else v.textContent=val;
    tx.appendChild(v);
    item.appendChild(tx);
    cbody.appendChild(item);
  });
  contact.appendChild(cbody);
  right.appendChild(contact);

  layout.append(left,right);
  root.appendChild(layout);
}

init();
</script>
</body>
</html>
